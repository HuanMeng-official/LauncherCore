[package]
name = "mclc"
version = "0.1.1"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "stream", "form"] }
tokio = { version = "1.54.0", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = "9.0.5"
dirs = "7.0.0"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
tempfile = "3.27.0"
url = "2.5.8"
futures-util = "0.3.34"
indicatif = "0.18.6"
base64 = "0.23.1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
rpassword = "7.5.4"
md-5 = "0.11.0"